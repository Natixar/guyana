name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning deploy/deploy.sh deploy/steps/*.sh deploy/secrets/*.sh

      - name: syntaxe bash
        run: for f in deploy/deploy.sh deploy/steps/*.sh deploy/secrets/*.sh; do bash -n "$f"; done

      - name: commandes externes non gardées
        run: |
          # Gate hérité de bash-deploy-libs. Tant que le sous-module n'est pas
          # câblé, on se contente de signaler ; il deviendra bloquant ensuite.
          echo "TODO: câbler detect_unguarded_calls.sh avec le sous-module bash-deploy-libs"

      - name: syntaxe bats
        run: |
          sudo apt-get install -y -qq bats
          for f in deploy/verify/*.bats; do bats --count "$f" >/dev/null; done

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # CodeQL ne sait pas analyser Bash. Tant que le dépôt ne contient que
        # des scripts shell, 'actions' est le seul langage analysable — il
        # couvre les workflows eux-mêmes. À étendre (javascript, python…) dès
        # que le code applicatif arrive. Voir #55.
        language: [actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  ephemeral:
    name: ephemeral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: construire l'image du squelette
        run: docker build -t aurora-skeleton:ci deploy/skeleton

      - name: la lancer et l'interroger
        run: |
          docker run -d --name skel -p 127.0.0.1:8080:80 aurora-skeleton:ci \
            --root=/public --port=80 --page-fallback=/public/index.html
          for _ in $(seq 20); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/ | grep -q 'Hello world!'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/inconnu)" = 200

      - name: démonter
        if: always()
        run: docker rm -f skel || true

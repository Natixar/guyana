name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # Les tests du magasin s'exécutent contre un VRAI PostgreSQL. L'essentiel de
    # ce qu'ils vérifient est du comportement de la base — recouvrement
    # tstzrange, index GiST, contrainte d'intervalle non vide — et un bouchon
    # confirmerait mes hypothèses au lieu de les éprouver.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aurora
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning deploy/deploy.sh deploy/steps/*.sh deploy/secrets/*.sh

      - name: syntaxe bash
        run: for f in deploy/deploy.sh deploy/steps/*.sh deploy/secrets/*.sh; do bash -n "$f"; done

      - name: commandes externes non gardées
        run: |
          # detect_unguarded_calls.sh prend UN fichier, et il l'analyse en le
          # SOURÇANT avec PATH vidé. C'est un outil pour bibliothèques. Nos
          # scripts de deploy/ sont des exécutables : les sourcer les
          # exécuterait, ce qui n'est pas un contrôle mais un accident.
          #
          # Le gate deviendra applicable quand deploy/ passera par rr_run et
          # cg_guard — écart 25 de GAPS.md. D'ici là on le dit plutôt que de
          # forcer un contrôle inadapté ou de laisser un TODO muet.
          scan=deploy/lib/.claude/commands/software-configuration-management/scripts/detect_unguarded_calls.sh
          if [ ! -x "$scan" ]; then
            echo "::error::sous-module bash-deploy-libs absent ou incomplet"
            exit 1
          fi
          echo "::notice::detect_unguarded_calls.sh disponible ; inapplicable tant que deploy/ n'emploie pas command_guard (GAPS.md, écart 25)"
          # Ce qui EST vérifiable aujourd'hui : qu'aucun script n'appelle une
          # commande par un chemin absolu codé en dur, ce qui contournerait le
          # garde le jour où il sera en place.
          # Le shebang est exclu : c'est le seul chemin absolu légitime, et il
          # ne passe par aucun garde puisqu'il précède l'interpréteur.
          if grep -nE '(^|[^[:alnum:]_/])/(usr/)?s?bin/[a-z]' \
               deploy/deploy.sh deploy/steps/*.sh deploy/secrets/*.sh \
             | grep -v ':1:#!'; then
            echo "::error::chemin absolu codé en dur vers une commande"
            exit 1
          fi
          echo "aucun chemin de commande codé en dur"

      - name: syntaxe bats
        run: |
          sudo apt-get install -y -qq bats
          for f in deploy/verify/*.bats; do bats --count "$f" >/dev/null; done

      # Hugo passe la table de libellés au module par « @params ». Rien ne relie
      # une clé demandée à une clé définie : renommer une entrée casse son
      # consommateur sans erreur de construction. C'est la faute #62, neuf
      # libellés muets. Le contrôle est ici et non dans le job « ephemeral »
      # parce qu'il ne demande ni Hugo ni Docker — il doit échouer vite.
      - name: libellés d'interface résolus
        run: python3 site/check-labels.py

      # « Un moteur, deux hôtes » : le navigateur et le signataire exécutent le
      # même fichier source, les mêmes vecteurs et le même comparateur. Ce job
      # est l'hôte Node. Sans lui, la propriété est une intention — rien
      # n'empêcherait les deux côtés de diverger entre deux revues.
      - name: moteur — vecteurs partagés, hôte Node
        run: node services/run-vectors.mjs

      # Ce que le signataire REFUSE. Une extraction non signée, altérée, ou
      # signée par un autre ; une cellule servie dont le client ne rend pas
      # compte ; une exclusion sans raison ; un chiffre que le recalcul ne
      # redonne pas. Un contrôle qui ne peut pas faire échouer un test est
      # décoratif — la règle de deploy/verify/ vaut ici aussi.
      - name: signataire — ce qu'il refuse
        working-directory: services/signer
        run: |
          npm ci --omit=optional
          node --test "*.test.mjs"

      # Le magasin signe ce qu'il sert, en Python ; le signataire vérifie cette
      # signature, en JavaScript. Ce qui est signé, ce sont des octets : si les
      # deux langages ne sérialisent pas identiquement, rien ne se vérifie et la
      # panne est muette — une signature qui ne correspond pas ressemble à une
      # signature invalide, pas à un désaccord d'encodage. Les deux hôtes
      # exécutent donc les MÊMES vecteurs.
      - name: sérialisation canonique — hôte JavaScript
        run: node services/run-jcs-vectors.mjs

      - name: magasin — sérialisation, signature, et la base
        working-directory: services/store
        env:
          STORE_DSN: postgresql://postgres:test@localhost:5432/aurora
        run: |
          # Les dépendances du service viennent de son requirements.txt, épinglé :
          # les réénumérer ici en produit une seconde liste, qui diverge. C'est
          # arrivé — fastapi y manquait, le module de test l'importe, et la
          # collecte échouait avant le premier cas. Rien ne l'avait vu parce que
          # ce job ne s'était jamais exécuté sur la branche.
          python3 -m pip install --quiet -r requirements.txt pytest httpx
          python3 -m pytest -q

      # Les deux moitiés d'un seul contrôle. Python signe, JavaScript vérifie —
      # et l'échec serait muet : une signature DER là où WebCrypto attend r||s
      # ne lève pas, elle renvoie false, ce qui ressemble à une clé fausse.
      # Deux implémentations qui se croient d'accord ne valent rien tant
      # qu'aucune n'a vérifié la signature de l'autre.
      - name: interopérabilité de signature — Python signe, JavaScript vérifie
        run: node services/verify-store-signature.mjs

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # CodeQL ne sait pas analyser Bash. Sur cette branche le dépôt ne
        # contient que du shell, donc 'actions' — qui couvre les workflows
        # eux-mêmes — est le seul langage analysable.
        # APRÈS LA FUSION DE h1 : ajouter 'javascript-typescript', le site
        # apporte des modules ES qui signent des documents et méritent
        # l'analyse bien plus que les workflows.
        language: [actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  ephemeral:
    name: ephemeral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # NOTE — ce job exerce encore le squelette v0. Après la fusion de la
      # branche h1, il doit construire site/ avec Hugo et exécuter
      # deploy/verify/*.bats contre l'instance éphémère, ce qui est le seul
      # moyen d'exercer les invariants sans toucher à kubb.
      - name: construire le site
        run: |
          # deploy/skeleton n'existe plus : le lanceur déploie site/. Ce job
          # doit faire de même — suivi en #58. En attendant il construit le
          # site avec Hugo et l'interroge, ce qui exerce au moins l'image
          # réellement déployée.
          curl -sSL -o /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb
          (cd site && hugo --logLevel error)
          printf 'FROM ghcr.io/static-web-server/static-web-server:2\nCOPY public/ /public/\n' > site/Dockerfile
          docker build -t aurora-site:ci site

      - name: la lancer et l'interroger
        run: |
          docker run -d --name skel -p 127.0.0.1:8080:80 aurora-site:ci \
            --root=/public --port=80 --page-fallback=/public/index.html
          for _ in $(seq 20); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/ | grep -q 'Natixar Gold Trace'
          curl -sf http://127.0.0.1:8080/api/v1/me | grep -q 'did:web'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/inconnu)" = 200

      # LES TESTS DU SIGNATEUR TOURNENT DANS SON IMAGE, pas seulement depuis le
      # dépôt. Depuis le dépôt tous les fichiers existent ; dans l'image, seuls
      # ceux que le Dockerfile a copiés. Un module qui gagne une dépendance non
      # copiée passe alors la CI et redémarre en boucle en production sur
      # ERR_MODULE_NOT_FOUND — c'est arrivé le 1er août 2026.
      - name: le signataire tourne dans son image
        run: |
          docker build -q -f services/signer/Dockerfile -t aurora-signer:ci .
          docker run --rm aurora-signer:ci node --test '/app/*.test.mjs'

      - name: démonter
        if: always()
        run: docker rm -f skel || true

{{/* Installation : opération unique, faite une fois avec Natixar en visio. */}}
<div class="card" data-setup hidden>
  <h2>{{ i18n "setup" }}</h2>
  <p>{{ i18n "setupOnce" }}</p>

  <p><button class="btn btn--primary" data-create-key>{{ i18n "createKey" }}</button></p>

  <div data-setup-result hidden>
    <dl class="facts">
      <div><dt>{{ i18n "fingerprint" }}</dt><dd data-fingerprint>—</dd></div>
    </dl>
    <p class="muted">{{ i18n "readAloud" }}</p>
    <p><button class="btn btn--primary" data-download-did>{{ i18n "downloadDid" }}</button></p>
    <p class="muted">{{ i18n "thenPublish" | safeHTML }}
       <a href="{{ (site.GetPage "/installation").RelPermalink }}">{{ (site.GetPage "/installation").Title }}</a>.</p>
  </div>
</div>

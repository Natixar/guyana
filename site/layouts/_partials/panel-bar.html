<div class="card">
  <h2>{{ i18n "barPanelTitle" }} <span data-pour-origin class="badge badge--pending" hidden></span></h2>

  <h3 class="subhead">{{ i18n "youAttest" }}</h3>
  <p class="muted">{{ i18n "youAttestBody" }}</p>
  <dl class="facts" data-operator-facts></dl>

  <h3 class="subhead">{{ i18n "calculatorAttests" }}</h3>
  <p class="muted">{{ i18n "calculatorAttestsBody" }}</p>
  <dl class="facts" data-calculator-facts></dl>
  <p><span data-calculator-status class="badge badge--pending">{{ i18n "awaitingCalculator" }}</span></p>

  <p class="actions">
    <button class="btn btn--primary" data-sign disabled>{{ i18n "confirmPour" }}</button>
    <span data-sign-status class="muted"></span>
  </p>

  <div data-signed hidden>
    <dl class="facts">
      <div><dt>{{ i18n "subjectId" }}</dt><dd data-signed-subject></dd></div>
      <div><dt>{{ i18n "signedBy" }}</dt><dd data-signed-by></dd></div>
    </dl>
    <p><button class="btn btn--primary" data-download-credential>{{ i18n "downloadCredential" }}</button></p>
  </div>
</div>

<div class="card">
  <h2>{{ i18n "barPanelTitle" }}</h2>
  <dl class="facts">
    {{ range site.Params.barFields }}
      <div><dt>{{ .label }}</dt><dd data-field="{{ .key }}">—</dd></div>
    {{ end }}
  </dl>
  <p style="margin-top:1.5rem">
    <button class="btn btn--primary" data-sign disabled>{{ i18n "confirmPour" }}</button>
  </p>
</div>

# Contrôle d'empreinte avant publication — guide d'installation
didCheckTitle      = "Check before you publish"
didCheckWhy        = "Before replacing the published file, make sure the one online is still the document your new file was built on. If a colleague added a key in between, publishing yours would drop theirs — silently. Nothing here is sent anywhere: both files are read in this browser. Note that Get-FileHash on Windows, certutil, or sha256sum on Linux all give a different answer, and that is on purpose — the fingerprint covers the document in canonical form, not the bytes of the file, so reformatting it in an editor does not change the result. No general-purpose hashing tool can compute it, which is why this check is here."
didCheckOnline     = "1. The file currently published on your domain"
didCheckNext       = "2. The new file you are about to publish"
didCheckDigest     = "Fingerprint of the published document"
didCheckKeys       = "Keys it contains"
didCheckBuiltOn    = "The new file was built on"
didCheckWaiting    = "Load both files"
didCheckMatch      = "Match — the new file was built on exactly this published document. Publishing it keeps every key."
didCheckMismatch   = "MISMATCH — the published document is not the one your new file was built on. It changed after you loaded it. Publishing now would drop the keys added in between. Load the published file into the signing page again and rebuild."
didCheckNoPrevious = "The new file declares no previous document — it will REPLACE whatever is published, and every certificate signed by a key not in it becomes impossible to verify. This is correct only for a first publication."
didCheckNoneDeclared = "no previous document declared"
didCheckNotJson    = "not a JSON object"

didMergeAtomic     = "Before publishing, check that the online file still has this fingerprint. Reading, editing and publishing are three steps, and nothing here can make them one: if someone else adds a key in between, publishing this file would silently drop theirs. Open the file with an editor that locks it, and keep it locked until the new one is in place."


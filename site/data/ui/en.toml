qualityAxesNote          = "The four origin columns share 100 % of a row. The last one does not belong to that share and is not part of it: a MEASURED record can also be MISSING, because the month it was copied from was itself measured. MISSING means a date is absent from a periodic series and the record reconstructs it, as December 2024 is reconstructed from December 2025. Nothing here says whether a calculation rule was short of one of its inputs: knowing that requires the calculation intent, which this release does not store — every record is one metric under one emission factor, and that is all it claims."

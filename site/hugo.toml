baseURL = "https://guyana.natixar.pro/"
# Anglais : le Guyana est anglophone, le contrat et le paquet de données le
# sont, et les interlocuteurs opérationnels d'AGM sont locaux. Le chinois est
# la langue de l'encadrement expatrié, pas celle de la salle d'or.
locale = "en-GB"
defaultContentLanguage = "en"
title = "Natixar Gold Trace"

# Pas de flux, pas de sitemap, pas de taxonomies : ce site a deux pages.
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT", "404"]

[params]
  platformName = "Natixar Gold Trace"
  issuerDid = "did:web:guygold.com"

  # Champs affichés pour un lingot. Ordre et libellés modifiables ici, sans
  # toucher au gabarit ; les clés sont celles du modèle de données.
  [[params.barFields]]
    key = "barId"
    label = "Bar identifier"
  [[params.barFields]]
    key = "pourDate"
    label = "Pour date"
  [[params.barFields]]
    key = "weight"
    label = "Weight"
  [[params.barFields]]
    key = "assay"
    label = "Assay"
  [[params.barFields]]
    key = "carbonIntensity"
    label = "Carbon intensity"

[imaging]
  # Lanczos donne le meilleur rendu sur un logo au trait fortement réduit.
  resampleFilter = "Lanczos"
  quality = 85
  [imaging.exif]
    disableDate = true
    disableLatLong = true

[build]
  # Les jetons sont dans un fichier commenté ; on ne veut pas que Hugo
  # supprime les commentaires avant que le CSS ait servi à quelqu'un.
  writeStats = false

[minify]
  disableCSS = false
  disableJS = false
  disableHTML = true   # lisibilité du rendu > 2 Ko

[security]
  [security.funcs]
    getenv = ["^HUGO_", "^CI$"]
